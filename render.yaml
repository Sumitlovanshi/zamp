# Render blueprint: dashboard -> New -> Blueprint -> select this repo.
# Free plan: sleeps after ~15 min idle (~50 s cold start on the next visit);
# in-memory upload sessions are lost on sleep. The sample gallery is baked
# into the image and unaffected. See DEPLOY.md for the trade-off table.
services:
  - type: web
    name: tallyproof
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false        # either key enables uploads; omit both for gallery-only mode
      - key: GEMINI_API_KEY
        sync: false        # free tier works for a demo (see DEPLOY.md for the caveats)
      - key: TALLYPROOF_DAILY_BUDGET
        value: "200"       # keeps a free Gemini key inside its ~250 requests/day

